<div class="gptr-settings-modal">
    <div class="modal-header">
        <div class="modal-title">GPTResearcher Settings</div>
        <div class="close" data-local-action="closeModal" aria-label="Close">
            <img class="close-icon" src="./assets/icons/x-mark.svg" alt="close">
        </div>
    </div>

    <div class="modal-body gptr-settings-body">
        <section id="gptrModelsPanel" class="gptr-panel active">
            <div class="gptr-settings-grid">
                <label class="form-item">
                    <span class="form-label">Fast LLM</span>
                    <div class="gptr-model-combobox" data-model-field="fastLlm">
                        <input id="gptrFastLlm" class="form-input gptr-model-input" type="text" spellcheck="false" autocomplete="off">
                        <button class="gptr-model-toggle" type="button" data-model-toggle="fastLlm" aria-label="Show Fast LLM models">⌄</button>
                        <div class="gptr-model-options" data-options-for="fastLlm"></div>
                    </div>
                </label>
                <label class="form-item">
                    <span class="form-label">Smart LLM</span>
                    <div class="gptr-model-combobox" data-model-field="smartLlm">
                        <input id="gptrSmartLlm" class="form-input gptr-model-input" type="text" spellcheck="false" autocomplete="off">
                        <button class="gptr-model-toggle" type="button" data-model-toggle="smartLlm" aria-label="Show Smart LLM models">⌄</button>
                        <div class="gptr-model-options" data-options-for="smartLlm"></div>
                    </div>
                </label>
                <label class="form-item">
                    <span class="form-label">Strategic LLM</span>
                    <div class="gptr-model-combobox" data-model-field="strategicLlm">
                        <input id="gptrStrategicLlm" class="form-input gptr-model-input" type="text" spellcheck="false" autocomplete="off">
                        <button class="gptr-model-toggle" type="button" data-model-toggle="strategicLlm" aria-label="Show Strategic LLM models">⌄</button>
                        <div class="gptr-model-options" data-options-for="strategicLlm"></div>
                    </div>
                </label>
                <label class="form-item">
                    <span class="form-label">Embedding</span>
                    <div class="gptr-model-combobox" data-model-field="embedding">
                        <input id="gptrEmbedding" class="form-input gptr-model-input" type="text" spellcheck="false" autocomplete="off">
                        <button class="gptr-model-toggle" type="button" data-model-toggle="embedding" aria-label="Show embedding models">⌄</button>
                        <div class="gptr-model-options" data-options-for="embedding"></div>
                    </div>
                </label>
                <label class="form-item">
                    <span class="form-label">Retriever</span>
                    <select id="gptrRetriever" class="form-input">
                        <optgroup label="General web">
                            <option value="duckduckgo">DuckDuckGo - no API key</option>
                            <option value="tavily">Tavily - requires TAVILY_API_KEY</option>
                            <option value="brave">Brave - requires BRAVE_API_KEY</option>
                            <option value="serper">Serper - requires SERPER_API_KEY</option>
                            <option value="serpapi">SerpAPI - requires SERPAPI_API_KEY</option>
                            <option value="bing">Bing - requires BING_API_KEY</option>
                            <option value="google">Google - requires GOOGLE_API_KEY</option>
                            <option value="exa">Exa - requires EXA_API_KEY</option>
                            <option value="searchapi">SearchAPI - requires SEARCHAPI_API_KEY</option>
                        </optgroup>
                        <optgroup label="Academic">
                            <option value="arxiv">arXiv - no API key</option>
                            <option value="semantic_scholar">Semantic Scholar - optional API key</option>
                            <option value="pubmed_central">PubMed Central - no API key</option>
                            <option value="openalex">OpenAlex - no API key</option>
                        </optgroup>
                        <optgroup label="MCP">
                            <option value="mcp">MCP - requires MCP server settings</option>
                        </optgroup>
                        <optgroup label="Advanced">
                            <option value="custom">Custom - requires custom retriever code</option>
                            <option value="crw">CRW - advanced</option>
                            <option value="groundroute">GroundRoute - advanced</option>
                            <option value="xquik">XQuik - advanced</option>
                            <option value="mock">Mock - testing only</option>
                        </optgroup>
                    </select>
                    <span id="gptrRetrieverHelp" class="form-help gptr-retriever-help"></span>
                </label>
            </div>
        </section>

        <div class="gptr-settings-actions">
            <button id="gptrSaveSettings" type="button" class="general-button" data-local-action="saveSettings">Save</button>
            <button id="gptrOpenResearcherUi" type="button" class="general-button gptr-secondary-button" data-local-action="openResearcherUi">Open GPTResearcher UI</button>
        </div>
        <div id="gptrSettingsStatus" class="gptr-settings-status" role="status" aria-live="polite"></div>
    </div>
</div>
