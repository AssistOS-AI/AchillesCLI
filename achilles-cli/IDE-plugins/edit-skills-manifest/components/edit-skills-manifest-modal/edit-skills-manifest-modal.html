<div class="modal-header">
    <div class="modal-title">Edit Skills Manifest</div>
    <div class="close" data-local-action="closeModal" aria-label="Close">
        <img class="close-icon" src="/explorer/assets/icons/x-mark.svg" alt="close">
    </div>
</div>
<div class="modal-body edit-skills-manifest-modal-body">
    <div class="edit-skills-manifest-path" data-manifest-path></div>
    <form class="edit-skills-manifest-add-row" data-add-form>
        <input id="editSkillsManifestRepoInput" name="repositoryUrl" type="text" autocomplete="off" spellcheck="false" placeholder="Git repository URL">
        <button class="general-button" type="submit">Add</button>
    </form>
    <div class="edit-skills-manifest-presets">
        <div class="edit-skills-manifest-section-title">Suggested repositories</div>
        <div class="edit-skills-manifest-preset-list" data-preset-list></div>
    </div>
    <div class="edit-skills-manifest-status" data-status hidden></div>
    <div class="edit-skills-manifest-list" data-repository-list></div>
</div>
